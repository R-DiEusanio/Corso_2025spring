<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Login / Registrazione</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="text-center mb-4">Benvenuto</h1>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <ul class="nav nav-tabs mb-3" id="authTabs">
                        <li class="nav-item">
                            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#login">Login</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#register">Registrazione</button>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <!-- LOGIN -->
                        <div class="tab-pane fade show active" id="login">
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label>Email</label>
                                    <input type="email" class="form-control" id="loginEmail" required>
                                </div>
                                <div class="mb-3">
                                    <label>Password</label>
                                    <input type="password" class="form-control" id="loginPassword" required>
                                </div>
                                <button class="btn btn-primary w-100" type="submit">Login</button>
                            </form>
                        </div>

                        <!-- REGISTRAZIONE -->
                        <div class="tab-pane fade" id="register">
                            <form id="registerForm">
                                <div class="mb-3">
                                    <label>Email</label>
                                    <input type="email" class="form-control" id="registerEmail" required>
                                </div>
                                <div class="mb-3">
                                    <label>Password</label>
                                    <input type="password" class="form-control" id="registerPassword" required>
                                </div>
                                <button class="btn btn-success w-100" type="submit">Registrati</button>
                            </form>
                        </div>
                    </div>

                    <div id="message" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function sendAuthRequest(url, email, password) {
        const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const messageDiv = document.getElementById("message");

        if (res.ok) {
            const data = await res.json();
            // Salvo il token nel localStorage
            localStorage.setItem("jwtToken", data.token);
            localStorage.setItem("utenteEmail", data.utente.email);
            localStorage.setItem("utenteRuolo", data.utente.ruolo);

            messageDiv.innerHTML = `<div class="alert alert-success">Accesso riuscito! Reindirizzamento...</div>`;

            // Vai alla dashboard dopo 1 secondo
            setTimeout(() => {
                window.location.href = "/dashboard.html";
            }, 1000);
        } else {
            const err = await res.text();
            messageDiv.innerHTML = `<div class="alert alert-danger">Errore: ${err}</div>`;
        }
    }

    document.getElementById("loginForm").addEventListener("submit", async e => {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;
        await sendAuthRequest("/auth/login", email, password);
    });

    document.getElementById("registerForm").addEventListener("submit", async e => {
        e.preventDefault();
        const email = document.getElementById("registerEmail").value;
        const password = document.getElementById("registerPassword").value;
        await sendAuthRequest("/auth/register", email, password);
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
