<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Anagrafica Discenti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="text-center mb-4">Anagrafica Discenti</h1>

    <!-- Form -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form id="discenti-form" class="row g-3">
                <input type="hidden" id="discenti-form-id">
                <div class="col-md-4">
                    <label class="form-label">Nome</label>
                    <input type="text" id="discenti-form-nome" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Cognome</label>
                    <input type="text" id="discenti-form-cognome" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Matricola</label>
                    <input type="text" id="discenti-form-matricola" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Età</label>
                    <input type="number" id="discenti-form-eta" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Città Residenza</label>
                    <input type="text" id="discenti-form-cittaResidenza" class="form-control" required>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary">Salva</button>
                    <button type="button" id="discenti-form-reset" class="btn btn-secondary">Reset</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabella -->
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover text-center">
                <thead class="table-dark">
                <tr>
                    <th>Nome</th>
                    <th>Cognome</th>
                    <th>Matricola</th>
                    <th>Età</th>
                    <th>Città</th>
                    <th>Azioni</th>
                </tr>
                </thead>
                <tbody id="discenti-tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
<script>
    initCrud({
        endpoint: "/discenti",
        formId: "discenti-form",
        tableBodyId: "discenti-tbody",
        fields: ["nome", "cognome", "matricola", "eta", "cittaResidenza"]
    });
</script>
</body>
</html>
