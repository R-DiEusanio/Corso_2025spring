<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Invio Email</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="text-center mb-4">Invio Email</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <form id="email-form" class="row g-3">
                <div class="col-12">
                    <label for="email-to" class="form-label">Destinatario</label>
                    <input type="email" id="email-to" class="form-control" placeholder="Inserisci l'email del destinatario" required>
                </div>
                <div class="col-12">
                    <label for="email-subject" class="form-label">Oggetto</label>
                    <input type="text" id="email-subject" class="form-control" placeholder="Oggetto dell'email" required>
                </div>
                <div class="col-12">
                    <label for="email-text" class="form-label">Testo</label>
                    <textarea id="email-text" class="form-control" rows="5" placeholder="Scrivi il testo dell'email" required></textarea>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary">Invia Email</button>
                    <button type="reset" class="btn btn-secondary">Reset</button>
                </div>
            </form>
            <div id="email-result" class="mt-3"></div>
        </div>
    </div>
</div>

<script>
    document.getElementById("email-form").addEventListener("submit", async function (e) {
        e.preventDefault();

        const to = document.getElementById("email-to").value;
        const subject = document.getElementById("email-subject").value;
        const text = document.getElementById("email-text").value;

        const response = await fetch("/email/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ to, subject, text })
        });

        const resultDiv = document.getElementById("email-result");
        if (response.ok) {
            resultDiv.innerHTML = `<div class="alert alert-success">Email inviata con successo a ${to}!</div>`;
            document.getElementById("email-form").reset();
        } else {
            resultDiv.innerHTML = `<div class="alert alert-danger">Errore nell'invio dell'email</div>`;
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
