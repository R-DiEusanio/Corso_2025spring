name: Spring Boot CI

# Quando eseguire il workflow
on:
  push:        # Ogni volta che fai push
    branches:
      - main
      - postman
  pull_request: # Ogni volta che apri una PR
    branches:
      - main
      - postman

jobs:
  build:
    runs-on: ubuntu-latest  # Ambiente di esecuzione

    steps:
      # 1. Checkout del codice
      - name: Checkout del repository
        uses: actions/checkout@v3

      # 2. Setup di Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cache delle dipendenze Maven per velocizzare la build
      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven

      # 4. Esegui build e test con Maven
      - name: Build e Test con Maven
        run: mvn clean install -B
